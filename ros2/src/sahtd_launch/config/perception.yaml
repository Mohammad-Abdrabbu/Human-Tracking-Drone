# Perception stack parameters (YOLO + ByteTrack MOT)

yolo_node:
  ros__parameters:
    # Path to YOLOv8n weights (leave empty to use auto-detected default)
    model_path: ""

    # Detection thresholds
    conf_thres: 0.30      # raised from 0.25 to reduce false positives
    iou_thres: 0.50         # NMS IoU threshold

    # Image size (keep consistent with camera / Gazebo)
    imgsz_w: 640
    imgsz_h: 360

    # Device: "cpu" or "cuda:0" if you have a GPU
    device: "cuda:0"

    # Only detect person class (COCO id 0)
    class_filter: [0]

    # Optional debug outputs
    publish_debug_image: true
    debug_fps_log: true

bytetrack_node:
  ros__parameters:
    # ByteTrack tuning (REDUCED track_buffer for 10Hz operation)
    track_thresh: 0.5
    match_thresh: 0.8
    track_buffer: 10      # was 30 - reduced to prevent ghost boxes at ~10Hz

    # Extra MOT config (adjust to match your node's expectations)
    min_box_area: 120.0     # raised from 10 to filter tiny ghost boxes
    mot_fps: 15.0

    # How long to keep lost tracks alive (frames)
    max_age: 10             # was 30 - reduced to match track_buffer

    # Whether to log debug info
    debug_tracks: true
