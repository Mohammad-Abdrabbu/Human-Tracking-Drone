# Geo-guard configuration for Scene 2 (Geo-fence Demo)
# TRIPLED SIZE: 24m x 24m playground

target_guard_node:
  ros__parameters:
    # Playground polygon vertices: 24m x 24m
    # Vertices: (4,-12) → (28,-12) → (28,12) → (4,12)
    vertices: [4.0, -12.0, 28.0, -12.0, 28.0, 12.0, 4.0, 12.0]
    
    # Safety margins
    soft_margin_m: 1.0
    hard_margin_m: 0.0
    
    # Publishing rate
    publish_rate_hz: 5.0

geo_guard_node:
  ros__parameters:
    # Same playground polygon for drone guard
    vertices: [4.0, -12.0, 28.0, -12.0, 28.0, 12.0, 4.0, 12.0]
    
    soft_margin_m: 1.0
    hard_margin_m: 0.5
    debounce_samples: 3
    min_hold_ms: 200

actor_pose_selector_node:
  ros__parameters:
    target_actor_name: "person_violator"
    output_frame_id: "map"
    publish_rate_hz: 10.0
