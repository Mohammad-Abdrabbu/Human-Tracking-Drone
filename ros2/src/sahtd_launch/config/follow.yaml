follow_node:
  ros__parameters:
    # Image size (UPDATED for 640x480 camera)
    img_w: 640
    img_h: 480

    # Stand-off / geometry
    stand_off_px: 86.0
    max_close_px: 143.0

    # Locking / hysteresis
    lock_k_frames: 5.0
    no_track_hold_s: 10.0

    # Smoothing + deadzones
    lpf_alpha: 0.2
    yaw_deadzone: 0.03  # W1 tuned: reduced from 0.10 (5.7°) to 0.03 (1.7°)
    gate_ex: 0.35

    # Rate limits
    rate_limit_vx: 0.25  # Increased for faster acceleration when target moves
    rate_limit_yaw: 0.15

    # Gains
    kx: 0.020            # Increased for more aggressive following
    kyaw: 0.7

    # Command caps
    vx_max: 0.8
    yawrate_max: 0.5

    # Takeoff / offboard behaviour
    do_auto_takeoff: true
    takeoff_mode: "action"        # or "offboard" if you later change it
    auto_takeoff_alt_m: 2.5

    # QoS / publishing behaviour
    publish_zero_when_waiting: true

    # Bbox velocity estimation (stationary target detection)
    h_velocity_lpf_alpha: 0.15
    stationary_threshold_px_s: 4.6
    stationary_stand_off_boost: 20.0    # Reduced from 42 to prevent excessive standoff

    # Proximity brake zone (force stop near stationary target)
    prox_brake_enable: true
    prox_brake_hf_thresh: 103.0         # 67 * 1.54 = 103.2 (scaled)
    prox_brake_vx_max: 0.10
    prox_brake_decel_rate: 0.50

    # Progressive speed control (SCALED for 640x480)
    progressive_speed_enable: true
    progressive_hf_start: 51.0          # 33 * 1.54 = 50.8
    progressive_hf_full: 154.0          # 100 * 1.54 = 154
    progressive_vx_min: 0.15

    # Three-zone control (TUNED for better far detection)
    zone_hover_lower_px: 60.0           # Lowered from 77 - enter FAR sooner
    zone_hover_upper_px: 80.0           # Lowered from 95 - narrower hover band
    zone_near_px: 100.0                 # Lowered from 112
    zone_hover_yaw_deg: 4.0
    zone_hover_eR_thresh: 11.0

    # Altitude hold (FIX for altitude drops)
    alt_hold_enable: true
    alt_hold_m: 2.5                     # Maintain 2.5m altitude during follow
