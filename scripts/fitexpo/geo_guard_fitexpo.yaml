# Geo-guard configuration for Fit Expo Demo
# Larger area with booth zones

geo_guard_node:
  ros__parameters:
    fence_mode: "DRONE_KEEP_OUT"

    # Polygon vertices in ENU (x1, y1, x2, y2, ...)
    # Fit Expo Hall area: x=[-3,20], y=[-10,10] (23m x 20m)
    # Drone spawn (0,0) is INSIDE
    vertices: [-3.0, -10.0, 20.0, -10.0, 20.0, 10.0, -3.0, 10.0]

    # Margins and debouncing
    soft_margin_m: 1.0
    hard_margin_m: 0.5
    debounce_samples: 3
    min_hold_ms: 200

    # Optional debug flags
    enable_debug_logs: true
    publish_debug_zone: false
