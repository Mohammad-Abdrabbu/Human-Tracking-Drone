# Render Blueprint for SAHTD
# This file auto-configures services when connected to Render

databases:
  - name: sahtd-db
    plan: free
    databaseName: sahtd
    user: sahtd

services:
  # Backend API
  - type: web
    name: sahtd-backend
    runtime: python
    plan: free
    buildCommand: chmod +x render-build.sh && ./render-build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sahtd-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: INGEST_TOKEN
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.10.0
    rootDir: web/backend
    healthCheckPath: /health

  # Frontend Static Site
  - type: web
    name: sahtd-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: web/frontend
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
